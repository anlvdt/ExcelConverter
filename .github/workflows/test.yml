name: Converter regression tests
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: ${{ matrix.shell }}
        run: |
          $allErrors = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) > $null
            $allErrors += $parseErrors
          }
          if ($allErrors) { $allErrors | Format-List; exit 1 }
      - name: Filesystem and publication regression tests
        shell: ${{ matrix.shell }}
        run: ./tests/Core.Tests.ps1
      - name: Worker isolation regression tests
        shell: ${{ matrix.shell }}
        run: ./tests/Worker.Tests.ps1
